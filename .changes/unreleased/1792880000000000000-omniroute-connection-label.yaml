kind: "Added"
body: "added the `X-OmniRoute-Connection-Name` response header naming the connection that served a routed chat response — its configured `name`, falling back to `displayName` and then to `email` so a connection that was never renamed still reports an account on every response (settable through `name` on `PUT /api/providers/{id}`); only the email embedded in the label is masked — its first three characters stay visible and the rest becomes asterisks, e.g. \"NVIDIA NIM (ca.*****************)\" — so it never exposes a raw email, connection IDs, API-key IDs, or credentials while the label around the email stays readable, and the header is omitted only when the connection carries no label at all"
time: "2026-10-24T22:00:00.000Z"
