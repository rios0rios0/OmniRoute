kind: "Added"
body: "added the `X-OmniRoute-Connection-Name` response header carrying the configured `name` of the connection that served chat responses, configurable through `name` on `PUT /api/providers/{id}`; the header is omitted when null/blank and masks only the email embedded in the label — its first three characters stay visible and the rest becomes asterisks, e.g. \"NVIDIA NIM (ca.*****************)\" — so it never exposes a raw email, connection IDs, API-key IDs, or credentials while the label around the email stays readable"
time: "2026-10-24T22:00:00.000Z"
