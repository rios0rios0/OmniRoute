kind: "Added"
body: "added the `X-OmniRoute-Connection-Name` response header carrying the configured display name of the connection that served chat responses, configurable through `displayName` on `PUT /api/providers/{id}`; the header is omitted when unset and masks email-shaped labels to their first three characters so it never exposes a raw email, connection IDs, API-key IDs, or credentials"
